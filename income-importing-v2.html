<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeTaxUSA — Importing Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── CSS Reset ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: inherit;
    }
    html, body {
      font-family: 'Lexend', sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #212f45;
      background: #f9f9f9;
    }

    /* ── GLOBAL HEADER ── */
    .global-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e5e9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      font-family: 'Lexend', sans-serif;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .header-logo-svg { height: 19px; width: auto; display: block; }
    .header-logo-year { font-size: 16px; font-weight: 700; color: #212f45; }
    .header-center { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #212f45; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header-nav-btn {
      display: flex; align-items: center; gap: 6px; background: none; border: none;
      cursor: pointer; font-family: 'Lexend', sans-serif; font-size: 14px; color: #212f45;
      height: 40px; padding: 0 12px; border-radius: 20px; white-space: nowrap;
    }
    .header-nav-btn:hover { background: #f4f9ff; text-decoration: underline; }
    .header-nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── TAB NAV ── */
    .tab-nav {
      width: 1152px; margin: 0 auto; display: flex; justify-content: space-between;
      align-items: center; height: 36px; margin-top: 48px; margin-bottom: 16px;
    }
    .tab {
      height: 36px; padding: 0 16px; border: 1px solid #e2e5e9; border-radius: 20px;
      background: #ffffff; font-family: 'Lexend', sans-serif; font-size: 14px; color: #667285;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; white-space: nowrap;
    }
    .tab--active { background: #212f45; color: #ffffff; border-color: #212f45; }
    .tab--complete {
      background: #ffffff; color: #212f45; border-color: transparent;
    }
    .tab--disabled {
      background: transparent; border-color: transparent; color: #667285;
      pointer-events: none; cursor: default; box-shadow: none;
    }

    /* ── CONTENT BOX ── */
    .content-box {
      width: 1152px; margin: 0 auto; background: #ffffff; border: none;
      border-radius: 8px; position: relative; padding: 40px 48px 40px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── IMPORTING STATE ── */
    .importing-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .importing-title {
      font-family: 'Lexend', sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
      color: #212f45;
      text-align: center;
    }
    .importing-gif {
      width: 600px;
      max-width: 100%;
      height: auto;
    }
    .importing-subtext {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 200px;
    }
    .importing-subtext p {
      font-family: 'Lexend', sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #212f45;
      text-align: center;
    }

    /* ── FOOTER ── */
    .footer {
      width: 100%; background: #f9f9f9;
      margin-top: 48px; padding: 16px 0 24px;
    }
    .footer-links {
      display: flex; justify-content: center; gap: 24px; font-size: 14px;
      color: #667285; padding: 8px 0;
    }
    .footer-links a { color: #667285; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    .footer-copyright { text-align: center; font-size: 12px; color: #667285; padding: 4px 0; }
  </style>
</head>
